<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Ananya Velagapudi</title>
    <meta name="description" content="This page doesn't exist on Ananya Velagapudi's portfolio." />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/styles.css" />

    <!-- Same pre-paint theme check as the home page, so the saved theme carries over. -->
    <script>
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch {
          // Storage can be blocked; fall back to the system preference.
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>

  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" href="/">
          <span aria-hidden="true">av<span class="accent">.</span></span>
          <span class="visually-hidden">Ananya Velagapudi, home</span>
        </a>
      </div>
    </header>

    <main class="container not-found">
      <div>
        <p class="not-found__code" aria-hidden="true">404</p>
        <h1 class="not-found__title">This page doesn't exist</h1>
        <p class="not-found__text">
          The link may be old. I rebuilt this site as a single page, so everything now lives on the
          home page.
        </p>
        <a class="button button--primary" href="/">Go to the home page</a>
      </div>
    </main>
  </body>
</html>
